<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修仙模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(100, 100, 255, 0.2);
            border: 1px solid rgba(100, 100, 255, 0.3);
        }
        h1 {
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(50, 50, 100, 0.5);
            border-radius: 15px;
        }
        .stat-item {
            text-align: center;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .stat-label {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 5px;
        }
        .stat-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffd700;
        }
        .stat-value.qi { color: #00ff88; }
        .stat-value.stones { color: #87ceeb; }
        .stat-value.mindset { color: #ff69b4; }
        .stat-value.days { color: #ffa500; }
        .realm-bar {
            margin-bottom: 20px;
        }
        .realm-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .realm-name {
            font-size: 1.3em;
            color: #ffd700;
        }
        .realm-stage {
            color: #aaa;
            font-size: 0.9em;
        }
        .progress-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            position: relative;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #7b68ee);
            border-radius: 10px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.85em;
        }
        .progress-bar.cultivation {
            background: linear-gradient(90deg, #00c853, #69f0ae);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-cultivate {
            background: linear-gradient(135deg, #00c853, #69f0ae);
            color: #1a1a2e;
        }
        .btn-explore {
            background: linear-gradient(135deg, #ff9800, #ffb74d);
            color: #1a1a2e;
        }
        .btn-breakthrough {
            background: linear-gradient(135deg, #e91e63, #f48fb1);
            color: white;
        }
        .btn-save {
            background: linear-gradient(135deg, #2196f3, #64b5f6);
            color: white;
        }
        .btn-load {
            background: linear-gradient(135deg, #9c27b0, #ba68c8);
            color: white;
        }
        .btn-new {
            background: linear-gradient(135deg, #f44336, #ef5350);
            color: white;
        }
        .event-log {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .event-log h3 {
            color: #ffd700;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }
        .log-entry {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(50, 50, 100, 0.3);
            border-left: 3px solid #4a90d9;
        }
        .log-entry.good { border-left-color: #00c853; }
        .log-entry.bad { border-left-color: #f44336; }
        .log-entry.neutral { border-left-color: #ff9800; }
        .log-entry-title {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .log-entry-text {
            font-size: 0.9em;
            color: #ccc;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.3);
        }
        .modal-title {
            font-size: 1.8em;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        .modal-description {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #ddd;
        }
        .modal-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(50, 50, 100, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }
        .option-btn:hover {
            background: rgba(70, 70, 120, 0.7);
            border-color: #ffd700;
        }
        .option-risk {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .option-risk.low { background: #4caf50; color: white; }
        .option-risk.medium { background: #ff9800; color: white; }
        .option-risk.high { background: #f44336; color: white; }
        .result-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .result-title {
            color: #ffd700;
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .close-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #666, #888);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
        }
        .close-btn:hover {
            background: linear-gradient(135deg, #888, #aaa);
        }
        .api-config {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .api-config h4 {
            color: #ffd700;
            margin-bottom: 10px;
        }
        .api-input {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            margin-bottom: 10px;
            font-family: monospace;
        }
        .api-input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ffd700;
        }
        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .game-over {
            text-align: center;
            padding: 40px;
        }
        .game-over h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .victory { color: #ffd700; }
        .defeat { color: #f44336; }
        .hidden { display: none; }
        
        /* 背包、商店、炼丹按钮样式 */
        .btn-inventory {
            background: linear-gradient(135deg, #00897b, #4db6ac);
            color: white;
        }
        .btn-shop {
            background: linear-gradient(135deg, #7b1fa2, #ba68c8);
            color: white;
        }
        .btn-alchemy {
            background: linear-gradient(135deg, #e65100, #ff9800);
            color: white;
        }
        
        /* 装备栏 */
        .equipment-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .equipment-slot {
            width: 60px;
            height: 60px;
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75em;
            color: #888;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .equipment-slot:hover {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .equipment-slot.filled {
            border-style: solid;
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        .equipment-slot .slot-icon {
            font-size: 1.5em;
        }
        .equipment-slot .slot-tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 5px 10px;
            border-radius: 5px;
            white-space: nowrap;
            font-size: 0.8em;
            display: none;
            z-index: 10;
        }
        .equipment-slot:hover .slot-tooltip {
            display: block;
        }
        
        /* 背包模态框 */
        .inventory-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .inventory-tab {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #aaa;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .inventory-tab:hover, .inventory-tab.active {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            border-color: #ffd700;
        }
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .inventory-slot {
            aspect-ratio: 1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            padding: 5px;
        }
        .inventory-slot:hover, .inventory-slot.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        .inventory-slot .item-name {
            font-size: 0.7em;
            text-align: center;
            color: #ccc;
        }
        .inventory-slot .item-quantity {
            position: absolute;
            bottom: 2px;
            right: 5px;
            font-size: 0.65em;
            color: #ffd700;
        }
        .inventory-slot .quality-common { color: #ffffff; }
        .inventory-slot .quality-rare { color: #64b5f6; }
        .inventory-slot .quality-precious { color: #ba68c8; }
        .inventory-slot .quality-legendary { color: #ffd700; }
        .inventory-detail {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .inventory-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .capacity-display {
            text-align: center;
            color: #888;
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        
        /* 商店模态框 */
        .shop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .shop-name {
            color: #ffd700;
            font-size: 1.3em;
        }
        .btn-refresh {
            padding: 8px 15px;
            background: linear-gradient(135deg, #555, #777);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
        }
        .btn-refresh:hover {
            background: linear-gradient(135deg, #666, #888);
        }
        .shop-intro {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-style: italic;
            color: #aaa;
        }
        .shop-grid {
            display: grid;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .shop-item:hover {
            border-color: rgba(255, 215, 0, 0.5);
            background: rgba(255, 215, 0, 0.1);
        }
        .shop-item-info {
            flex: 1;
        }
        .shop-item-name {
            font-weight: bold;
            margin-bottom: 3px;
        }
        .shop-item-desc {
            font-size: 0.8em;
            color: #888;
        }
        .shop-item-price {
            color: #87ceeb;
            font-weight: bold;
            margin-right: 15px;
        }
        .btn-buy {
            padding: 8px 20px;
            background: linear-gradient(135deg, #4caf50, #81c784);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, #66bb6a, #a5d6a7);
        }
        .btn-buy:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        /* 炼丹模态框 */
        .alchemy-recipes {
            display: grid;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .alchemy-recipe {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s;
        }
        .alchemy-recipe:hover, .alchemy-recipe.selected {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }
        .recipe-info {
            flex: 1;
        }
        .recipe-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        .recipe-materials {
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 3px;
        }
        .recipe-success {
            font-size: 0.85em;
            color: #4caf50;
        }
        .btn-craft {
            padding: 10px 25px;
            background: linear-gradient(135deg, #e65100, #ff9800);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 1em;
        }
        .btn-craft:hover {
            background: linear-gradient(135deg, #ff6d00, #ffa726);
        }
        .btn-craft:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .alchemy-result {
            text-align: center;
            padding: 20px;
        }
        .result-success {
            color: #4caf50;
            font-size: 1.2em;
        }
        .result-fail {
            color: #f44336;
            font-size: 1.2em;
        }
        /* 渡劫系统样式 */
        .tribulation-scene {
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a3e 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 120px;
            border: 2px solid rgba(138, 43, 226, 0.5);
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.3);
            text-align: center;
        }
        .tribulation-scene.thunder { border-color: #ffff00; box-shadow: 0 0 30px rgba(255, 255, 0, 0.4); }
        .tribulation-scene.fire { border-color: #ff4500; box-shadow: 0 0 30px rgba(255, 69, 0, 0.4); }
        .tribulation-scene.wind { border-color: #00ffff; box-shadow: 0 0 30px rgba(0, 255, 255, 0.4); }
        .tribulation-scene.demon { border-color: #ff00ff; box-shadow: 0 0 30px rgba(255, 0, 255, 0.4); }
        .tribulation-scene.all { border-color: #ffd700; box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); }
        .tribulation-info {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .tribulation-type {
            font-size: 1.3em;
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
        }
        .tribulation-rate, .tribulation-damage {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tribulation-preparations {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }
        .tribulation-preps {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tribulation-preps button {
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(50, 50, 100, 0.5);
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }
        .tribulation-preps button:hover:not(:disabled) {
            background: rgba(70, 70, 120, 0.7);
            border-color: #ffd700;
        }
        .tribulation-preps button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .tribulation-preps button.active {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
        }
        .tribulation-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .tribulation-result {
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
            text-align: center;
        }
        .tribulation-result h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .tribulation-result.great-success { background: rgba(255, 215, 0, 0.2); border: 2px solid #ffd700; }
        .tribulation-result.success { background: rgba(76, 175, 80, 0.2); border: 2px solid #4caf50; }
        .tribulation-result.injury { background: rgba(255, 152, 0, 0.2); border: 2px solid #ff9800; }
        .tribulation-result.death { background: rgba(244, 67, 54, 0.2); border: 2px solid #f44336; }
        .tribulation-result.great-success h3 { color: #ffd700; }
        .tribulation-result.success h3 { color: #4caf50; }
        .tribulation-result.injury h3 { color: #ff9800; }
        .tribulation-result.death h3 { color: #f44336; }
        .btn-tribulation {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-tribulation.start {
            background: linear-gradient(135deg, #9c27b0, #e91e63);
            color: white;
        }
        .btn-tribulation.cancel {
            background: rgba(100, 100, 100, 0.5);
            color: #aaa;
        }
        .btn-tribulation:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        .buff-indicator {
            background: linear-gradient(135deg, rgba(156, 39, 176, 0.3), rgba(233, 30, 99, 0.3));
            border: 1px solid rgba(156, 39, 176, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8em;
            color: #e1bee7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 修仙模拟器 🌟</h1>
        
        <div id="apiConfig" class="api-config">
            <h4>⚙️ API 配置</h4>
            <input type="text" id="apiKey" class="api-input" placeholder="MiniMax API Key">
            <input type="text" id="groupId" class="api-input" placeholder="Group ID">
            <button class="btn btn-save" onclick="saveApiConfig()">保存配置</button>
        </div>

        <div id="gameStats" class="stats-bar hidden">
            <div class="stat-item">
                <div class="stat-label">境界</div>
                <div class="stat-value" id="realmDisplay">炼气期</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">灵气</div>
                <div class="stat-value qi" id="qiDisplay">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">灵石</div>

        // 天劫类型定义
        const TRIBULATIONS = {

            },
            '化神飞升': {

            }

        // 炼丹配方
        const ALCHEMY_RECIPES = {
            '聚灵丹': { materials: { '灵草': 2, '灵石': 30 }, successRate: 0.8, desc: '炼制聚灵丹' },
            '心魔丹': { materials: { '安神草': 1, '灵石': 50 }, successRate: 0.7, desc: '炼制心魔丹' },
            '筑基丹': { materials: { '灵芝': 3, '灵石': 300 }, successRate: 0.5, desc: '炼制筑基丹' }
        };

        // 游戏状态
        let gameState = {
            realm: 0,       // 0-4 对应 炼气到化神
            stage: 0,       // 0-2 对应 初期/中期/后期
            qi: 0,
            maxQi: 100,
            spiritStones: 50,
            mindset: 50,
            days: 1,
            cultivationProgress: 0,
            eventLog: [],
            isGameOver: false,
            isVictory: false,
            // V2新增字段
            inventory: [],
            equippedTreasures: [null, null, null],
            maxInventorySlots: 20,
            shopItems: [],
            lastShopDay: 0,
            activeEffects: {
                breakthrough_boost: 0,
                cultivate_speed: 0,
                渡劫_mindset_protect: 0,
                attack: 0,
                defense: 0,
                cultivate_qi_rate: 0,
                渡劫_damage_reduce: 0,
                escape: 0,
                foresee_event: 0,
                all_stats: 0
            },
            // V3渡劫系统字段
            tribulation: {
                inProgress: false,
                currentStage: 0,
                totalStages: 9,
                currentType: null,
                preparations: [],
                damageTaken: 0,
                tribKey: null
            },
            hasTransmigrationBuff: false,
            tribulationRecord: []
        };

        // 每个境界需要的灵气和进度阈值
        const REALM_REQUIREMENTS = {
            0: { maxQi: 100, stageThreshold: [30, 60, 90], breakthroughQi: 100 },
            1: { maxQi: 200, stageThreshold: [60, 120, 180], breakthroughQi: 200 },
            2: { maxQi: 400, stageThreshold: [120, 240, 360], breakthroughQi: 400 },
            3: { maxQi: 800, stageThreshold: [240, 480, 720], breakthroughQi: 800 },
            4: { maxQi: 1600, stageThreshold: [480, 960, 1440], breakthroughQi: 1600 }
        };

        // API配置
        let apiConfig = {
            apiKey: '',
            groupId: ''
        };

        // 初始化
        function init() {
            loadApiConfig();
            updateDisplay();
        }

        // 加载API配置
        function loadApiConfig() {
            const saved = localStorage.getItem(CONFIG.apiConfigKey);
            if (saved) {
                apiConfig = JSON.parse(saved);
                document.getElementById('apiKey').value = apiConfig.apiKey || '';
                document.getElementById('groupId').value = apiConfig.groupId || '';
            }
        }

        // 保存API配置
        function saveApiConfig() {
            apiConfig.apiKey = document.getElementById('apiKey').value.trim();
            apiConfig.groupId = document.getElementById('groupId').value.trim();
            localStorage.setItem(CONFIG.apiConfigKey, JSON.stringify(apiConfig));
            alert('API配置已保存!');
        }

        // 开始新游戏
        function startNewGame() {
            gameState = {
                realm: 0,
                stage: 0,
                qi: 20,
                maxQi: 100,
                spiritStones: 50,
                mindset: 50,
                days: 1,
                cultivationProgress: 0,
                eventLog: [],
                isGameOver: false,
                isVictory: false,
                inventory: [],
                equippedTreasures: [null, null, null],
                maxInventorySlots: 20,
                shopItems: [],
                lastShopDay: 0,
                activeEffects: {
                    breakthrough_boost: 0,
                    cultivate_speed: 0,
                    渡劫_mindset_protect: 0,
                    attack: 0,
                    defense: 0,
                    cultivate_qi_rate: 0,
                    渡劫_damage_reduce: 0,
                    escape: 0,
                    foresee_event: 0,
                    all_stats: 0
                },
                tribulation: {
                    inProgress: false,
                    currentStage: 0,
                    totalStages: 9,
                    currentType: null,
                    preparations: [],
                    damageTaken: 0,
                    tribKey: null
                },
                hasTransmigrationBuff: false,
                tribulationRecord: []
            };
            saveGame();
            showGameUI();
            addLog('welcome', '欢迎', '你踏入修仙之路，成为一名炼气期修士。吸收天地灵气，开启你的修仙之旅！');
        }

        // 加载游戏
        function loadGame() {
            const saved = localStorage.getItem(CONFIG.storageKey);
            if (saved) {
                const loaded = JSON.parse(saved);
                // 确保V2新增字段存在（向后兼容）
                gameState = {
                    ...gameState,
                    ...loaded,
                    activeEffects: loaded.activeEffects || {
                        breakthrough_boost: 0,
                        cultivate_speed: 0,
                        渡劫_mindset_protect: 0,
                        attack: 0,
                        defense: 0,
                        cultivate_qi_rate: 0,
                        渡劫_damage_reduce: 0,
                        escape: 0,
                        foresee_event: 0,
                        all_stats: 0
                    },
                    equippedTreasures: loaded.equippedTreasures || [null, null, null],
                    inventory: loaded.inventory || [],
                    shopItems: loaded.shopItems || [],
                    lastShopDay: loaded.lastShopDay || 0,
                    tribulation: loaded.tribulation || {
                        inProgress: false,
                        currentStage: 0,
                        totalStages: 9,
                        currentType: null,
                        preparations: [],
                        damageTaken: 0,
                        tribKey: null
                    },
                    hasTransmigrationBuff: loaded.hasTransmigrationBuff || false,
                    tribulationRecord: loaded.tribulationRecord || []
                };
                // 重新计算装备效果
                recalculateAllEffects();
                if (gameState.isGameOver) {
                    showGameOverScreen();
                } else {
                    showGameUI();
                }
            } else {
                alert('没有找到存档！');
            }
        }

        // 显示游戏UI
        function showGameUI() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('apiConfig').classList.add('hidden');
            document.getElementById('gameStats').classList.remove('hidden');
            document.getElementById('cultivationProgress').classList.remove('hidden');
            document.getElementById('equipmentBar').classList.remove('hidden');
            document.getElementById('gameButtons').classList.remove('hidden');
            document.getElementById('eventLog').classList.remove('hidden');
            updateDisplay();
            renderLog();
            updateEquipmentBar();
            // 检查商店刷新
            if (gameState.lastShopDay < gameState.days) {
                refreshShop(true);
            }
        }

        // 显示游戏结束画面
        function showGameOverScreen() {
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('gameStats').classList.add('hidden');
            document.getElementById('cultivationProgress').classList.add('hidden');
            document.getElementById('equipmentBar').classList.add('hidden');
            document.getElementById('gameButtons').classList.add('hidden');
            document.getElementById('eventLog').classList.add('hidden');
            
            let html = '<div class="game-over">';
            if (gameState.isVictory) {
                html += `<h2 class="victory">🎉 飞升成功！🎉</h2>
                         <p>历经${gameState.days}天，你终于突破化神期，白日飞升！</p>`;
            } else {
                html += `<h2 class="defeat">💀 陨落 💀</h2>
                         <p>修仙之路充满危险，你在第${gameState.days}天陨落...</p>`;
            }
            html += '<button class="btn btn-new" onclick="startNewGame()">重新开始</button></div>';
            document.getElementById('startScreen').innerHTML = html;
        }

        // 更新显示
        function updateDisplay() {
            const realmName = CONFIG.realms[gameState.realm];
            const stageName = CONFIG.stages[gameState.stage];
            
            document.getElementById('realmDisplay').textContent = `${realmName}期`;
            document.getElementById('qiDisplay').textContent = `${gameState.qi}/${gameState.maxQi}`;
            document.getElementById('stonesDisplay').textContent = gameState.spiritStones;
            document.getElementById('mindsetDisplay').textContent = gameState.mindset;
            document.getElementById('daysDisplay').textContent = gameState.days;
            
            document.getElementById('realmName').textContent = `${realmName}期`;
            document.getElementById('realmStage').textContent = stageName;
            
            const req = REALM_REQUIREMENTS[gameState.realm];
            const progressInStage = gameState.stage === 0 ? 
                gameState.cultivationProgress : 
                gameState.cultivationProgress - req.stageThreshold[gameState.stage - 1];
            const stageSize = gameState.stage === 0 ? 
                req.stageThreshold[0] : 
                (req.stageThreshold[gameState.stage] - req.stageThreshold[gameState.stage - 1]);
            const percentage = Math.min(100, (progressInStage / stageSize) * 100);
            
            document.getElementById('cultivationBar').style.width = `${percentage}%`;
            document.getElementById('cultivationBar').textContent = `${Math.round(percentage)}%`;
        }

        // 添加日志
        function addLog(type, title, text) {
            gameState.eventLog.unshift({ type, title, text, day: gameState.days });
            if (gameState.eventLog.length > 50) {
                gameState.eventLog.pop();
            }
            renderLog();
        }

        // 渲染日志
        function renderLog() {
            const container = document.getElementById('logEntries');
            const recentLogs = gameState.eventLog.slice(0, 5);
            container.innerHTML = recentLogs.map(log => `
                <div class="log-entry ${log.type}">
                    <div class="log-entry-title">第${log.day}天 - ${log.title}</div>
                    <div class="log-entry-text">${log.text}</div>
                </div>
            `).join('');
        }

        // 修炼
        function doCultivate() {
            const req = REALM_REQUIREMENTS[gameState.realm];
            let baseGain = 5 + Math.random() * 10 + gameState.realm * 3;
            // 应用装备和丹药效果
            baseGain *= (1 + gameState.activeEffects.cultivate_speed);
            baseGain *= (1 + gameState.activeEffects.cultivate_qi_rate);
            baseGain *= (1 + gameState.activeEffects.all_stats);
            const gain = Math.floor(baseGain);
            gameState.qi = Math.min(gameState.maxQi, gameState.qi + gain);
            gameState.cultivationProgress += gain;
            
            let logType = 'good';
            let logText = `修炼${gain}点灵气，感觉体内的灵力更加充沛。`;
            
            // 检查是否需要晋级
            if (gameState.cultivationProgress >= req.stageThreshold[gameState.stage] && gameState.stage < 2) {
                gameState.stage++;
                logText = `修炼${gain}点灵气，境界突破到${CONFIG.stages[gameState.stage]}！`;
                addLog(logType, '境界突破', logText);
            } else if (gameState.cultivationProgress >= req.stageThreshold[2]) {
                logText = `修炼${gain}点灵气，${CONFIG.realms[gameState.realm]}期修炼圆满，可以尝试突破到下一个境界！`;
                addLog('neutral', '境界圆满', logText);
            } else {
                addLog(logType, '修炼', logText);
            }
            
            gameState.days++;
            saveGame();
            updateDisplay();
            doMorningExercise();
        }

        // 晨运
        function doMorningExercise() {
            const gain = Math.floor(2 + Math.random() * 5);
            gameState.qi = Math.min(gameState.maxQi, gameState.qi + gain);
            gameState.mindset = Math.min(100, gameState.mindset + 1);
            updateDisplay();
        }

        // 探索（触发AI事件）
        async function doExplore() {
            if (!apiConfig.apiKey || !apiConfig.groupId) {
                alert('请先配置MiniMax API Key和Group ID！');
                document.getElementById('apiConfig').classList.remove('hidden');
                return;
            }

            openModal('探索中...', '<div class="loading">正在生成随机事件</div>', []);

            try {
                const eventData = await generateEvent();
                displayEventModal(eventData);
            } catch (error) {
                console.error('生成事件失败:', error);
                // 如果API失败，使用本地备用事件
                const localEvent = getLocalRandomEvent();
                displayEventModal(localEvent);
            }
        }

        // 生成随机事件
        async function generateEvent() {
            const realmName = CONFIG.realms[gameState.realm];
            const stageName = CONFIG.stages[gameState.stage];
            
            const eventTypes = ['奇遇', '挑战', '机缘', '平静', '劫难'];
            const weights = [0.2, 0.25, 0.15, 0.3, 0.1];
            const rand = Math.random();
            let cumulative = 0;
            let eventType = '平静';
            for (let i = 0; i < weights.length; i++) {
                cumulative += weights[i];
                if (rand < cumulative) {
                    eventType = eventTypes[i];
                    break;
                }
            }

            const prompt = `你是一个修仙游戏的事件生成器。

当前玩家状态：

            gameState.mindset = Math.max(0, Math.min(100, gameState.mindset + (effects.mindset || 0)));
            gameState.spiritStones = Math.max(0, gameState.spiritStones + (effects.spiritStones || 0));

        // 渡劫处理
        async function handleTribulation() {
            let survivalChance = gameState.mindset / 100;
            // 应用定神丹效果
            survivalChance *= (1 + gameState.activeEffects.渡劫_mindset_protect);
            survivalChance *= (1 + gameState.activeEffects.all_stats);
            
            if (Math.random() < survivalChance) {
                addLog('good', '渡劫成功', '天雷降临，你成功渡过天劫，修为大涨！');
                gameState.cultivationProgress = 0;
                gameState.stage = 0;
                gameState.realm = Math.min(4, gameState.realm + 1);
                gameState.maxQi = REALM_REQUIREMENTS[gameState.realm].maxQi;
                gameState.qi = Math.floor(gameState.qi / 2);
            } else {
                // 应用避火罩效果减伤
                const damageReduction = gameState.activeEffects.渡劫_damage_reduce + gameState.activeEffects.all_stats;
                const qiLoss = Math.floor(gameState.qi * (0.8 * (1 - damageReduction)));
                const mindsetLoss = Math.floor(30 * (1 - gameState.activeEffects.渡劫_mindset_protect));
                addLog('bad', '渡劫失败', `天雷过于猛烈，你重伤垂死...`);
                gameState.qi = Math.max(0, gameState.qi - qiLoss);
                gameState.mindset = Math.max(0, gameState.mindset - mindsetLoss);
            }
        }

        async function tryBreakthrough() {
            const req = REALM_REQUIREMENTS[gameState.realm];
            
            if (gameState.cultivationProgress < req.stageThreshold[2]) {
                alert('境界尚未圆满，无法突破！');
                return;
            }
            
            if (gameState.qi < req.breakthroughQi) {
                alert('灵气不足，无法突破！');
                return;
            }
            
            // 金丹期及以上需要渡劫
            if (gameState.realm >= 3) {
                const tribKey = getTribulationKey(gameState.realm, gameState.stage);
                gameState.tribulation = {
                    inProgress: true,
                    currentStage: 0,
                    totalStages: TRIBULATIONS[tribKey].stages,
                    currentType: TRIBULATIONS[tribKey].type,
                    preparations: [],
                    damageTaken: 0,
                    tribKey: tribKey
                };
                showTribulationUI();
                return;
            }
            
            if (!apiConfig.apiKey || !apiConfig.groupId) {
                // 本地突破
                localBreakthrough(false);
                return;
            }
            
            openModal('突破中...', '<div class="loading">正在生成突破描述</div>', []);

            let chance = (gameState.mindset / 100) * (gameState.qi / req.breakthroughQi);
            // 应用突破加成效果
            chance *= (1 + gameState.activeEffects.breakthrough_boost);
            chance *= (1 + gameState.activeEffects.all_stats);
            
            if (Math.random() < chance) {

        // 重新计算所有装备效果
        function recalculateAllEffects() {
            // 重置所有效果
            for (let key in gameState.activeEffects) {
                gameState.activeEffects[key] = 0;
            }
            // 累加装备效果
            for (const treasure of gameState.equippedTreasures) {
                if (treasure) {
                    const effectType = treasure.effect.type;
                    if (gameState.activeEffects.hasOwnProperty(effectType)) {
                        gameState.activeEffects[effectType] += treasure.effect.value;
                    }
                }
            }

        function updateEquipmentBar() {

            for (let i = 0; i < 3; i++) {
                const slot = document.getElementById(`equipSlot${i}`);
                const treasure = gameState.equippedTreasures[i];
                if (treasure) {
                    slot.classList.add('filled');
                    slot.querySelector('.slot-icon').textContent = treasure.icon || icons[i];
                    slot.querySelector('.slot-tooltip').textContent = `${treasure.name}\n${treasure.desc}`;
                } else {
                    slot.classList.remove('filled');
                    slot.querySelector('.slot-icon').textContent = icons[i];
                    slot.querySelector('.slot-tooltip').textContent = '空';
                }
            }
        }

            if (treasure) {
                // 移回背包
                addToInventory(treasure.type, treasure.name, 1, treasure.quality, treasure.effect, treasure.desc, treasure.icon);
                gameState.equippedTreasures[slotIndex] = null;
                recalculateAllEffects();

                addLog('neutral', '卸下灵宝', `卸下了${treasure.name}`);

        // 添加物品到背包
        function addToInventory(type, name, quantity, quality, effect, desc, icon) {
            // 查找是否已存在同类型物品
            const existing = gameState.inventory.find(item => item.name === name && item.type === type);
            if (existing) {
                existing.quantity += quantity;
            } else {
                if (gameState.inventory.length >= gameState.maxInventorySlots) {
                    return false; // 背包满了
                }
                gameState.inventory.push({
                    id: Date.now(),
                    type,
                    name,
                    quantity,
                    quality,
                    effect,
                    desc,
                    icon
                });
            }
            return true;
        }

        // 获取品质颜色
        function getQualityColor(quality) {
            const colors = {
                common: '#ffffff',
                rare: '#64b5f6',

            return colors[quality] || colors.common;

        function renderInventoryGrid() {
            const grid = document.getElementById('inventoryGrid');

                </div>
            `).join('');
        }

        function selectInvItem(idx) {
            let items = gameState.inventory;
            if (currentInvTab !== 'all') {
                items = items.filter(item => item.type === currentInvTab);
            }
            selectedInvItem = idx;
            const item = items[idx];
            renderInventoryGrid();
            
            document.getElementById('invDetail').style.display = 'block';
            document.getElementById('invDetailContent').innerHTML = `
                <div style="display:flex;align-items:center;gap:15px;margin-bottom:10px;">

                        <div style="font-weight:bold;font-size:1.2em;color:${getQualityColor(item.quality)}">${item.name}</div>
                        <div style="color:#888">${item.desc}</div>
                    </div>
                </div>
                <div style="color:#aaa">数量: ${item.quantity}</div>
            `;
            
            let actions = '';
            if (item.type === 'pill') {
                actions = `<button class="btn btn-cultivate" onclick="usePill('${item.name}', ${idx})">使用</button>`;
            } else if (item.type === 'treasure') {
                actions = `<button class="btn btn-breakthrough" onclick="equipTreasure('${item.name}', ${idx})">装备</button>`;
            }
            actions += `<button class="btn btn-save" onclick="sellItem(${idx})">出售(${Math.floor(item.quality === 'common' ? 10 : item.quality === 'rare' ? 50 : item.quality === 'precious' ? 200 : 1000)}灵石)</button>`;
            actions += `<button class="btn btn-new" onclick="discardItem(${idx})">丢弃</button>`;
            document.getElementById('invActions').innerHTML = actions;
        }

        function usePill(name, idx) {
            const pill = PILLS[name];
            if (!pill) return;
            
            const item = gameState.inventory.find((i, iidx) => {
                let items = gameState.inventory;
                if (currentInvTab !== 'all') items = items.filter(it => it.type === currentInvTab);
                return iidx === idx;
            });
            if (!item || item.quantity <= 0) return;
            
            item.quantity--;
            if (item.quantity <= 0) {
                gameState.inventory = gameState.inventory.filter(i => i.name !== name || i.type !== 'pill');
            }
            
            // 应用丹药效果
            switch (pill.effect.type) {
                case 'qi':
                    gameState.qi = Math.min(gameState.maxQi, gameState.qi + pill.effect.value);
                    addLog('good', '使用丹药', `服下${name}，灵气+${pill.effect.value}`);
                    break;
                case 'mindset':
                    gameState.mindset = Math.min(100, gameState.mindset + pill.effect.value);
                    addLog('good', '使用丹药', `服下${name}，心境+${pill.effect.value}`);
                    break;
                case 'breakthrough_boost':
                case 'cultivate_speed':
                case '渡劫_mindset_protect':
                    gameState.activeEffects[pill.effect.type] += pill.effect.value;
                    addLog('good', '使用丹药', `服下${name}，${pill.desc}（永久生效）`);
                    break;
            }
            
            saveGame();
            updateDisplay();
            renderInventoryGrid();
            document.getElementById('invDetail').style.display = 'none';
        }

        function equipTreasure(name, idx) {
            const treasure = TREASURES[name];
            if (!treasure) return;
            
            // 找到空槽位
            const emptySlot = gameState.equippedTreasures.findIndex(t => t === null);
            if (emptySlot === -1) {
                alert('装备栏已满！');
                return;
            }
            
            // 查找背包中的物品
            const itemIdx = gameState.inventory.findIndex(i => i.name === name && i.type === 'treasure');
            if (itemIdx === -1) return;
            
            const item = gameState.inventory[itemIdx];
            item.quantity--;
            if (item.quantity <= 0) {
                gameState.inventory.splice(itemIdx, 1);
            }
            
            // 装备
            gameState.equippedTreasures[emptySlot] = {
                name: item.name,
                type: item.type,
                quality: item.quality,
                effect: item.effect,
                desc: item.desc,
                icon: item.icon
            };
            
            recalculateAllEffects();
            updateEquipmentBar();
            saveGame();
            addLog('good', '装备灵宝', `装备了${name}`);
            renderInventoryGrid();
            document.getElementById('invDetail').style.display = 'none';
        }

        function sellItem(idx) {
            let items = gameState.inventory;
            if (currentInvTab !== 'all') {
                items = items.filter(item => item.type === currentInvTab);
            }
            const item = items[idx];
            if (!item) return;
            
            const prices = { common: 10, rare: 50, precious: 200, legendary: 1000 };
            const price = prices[item.quality] || 10;
            
            item.quantity--;
            if (item.quantity <= 0) {
                gameState.inventory = gameState.inventory.filter(i => i !== item);
            }
            
            gameState.spiritStones += price;
            saveGame();
            updateDisplay();
            renderInventoryGrid();
            document.getElementById('invDetail').style.display = 'none';
            addLog('neutral', '出售物品', `出售了${item.name}，获得${price}灵石`);
        }

        function discardItem(idx) {
            let items = gameState.inventory;
            if (currentInvTab !== 'all') {
                items = items.filter(item => item.type === currentInvTab);
            }
            const item = items[idx];
            if (!item) return;
            
            item.quantity--;
            if (item.quantity <= 0) {
                gameState.inventory = gameState.inventory.filter(i => i !== item);
            }
            
            saveGame();
            renderInventoryGrid();
            document.getElementById('invDetail').style.display = 'none';
            addLog('neutral', '丢弃物品', `丢弃了${item.name}`);
        }

            if (gameState.shopItems.length === 0) {

        function generateShopItems() {
            const allItems = [];
            // 收集所有丹药和灵宝
            for (const [name, pill] of Object.entries(PILLS)) {
                allItems.push({ type: 'pill', name, ...pill });
            }
            for (const [name, treasure] of Object.entries(TREASURES)) {
                allItems.push({ type: 'treasure', name, ...treasure });
            }
            
            // 随机选8-12个
            const count = 8 + Math.floor(Math.random() * 5);
            const shuffled = allItems.sort(() => Math.random() - 0.5);
            gameState.shopItems = shuffled.slice(0, Math.min(count, allItems.length));

            saveGame();

        function checkMaterials(materials) {
            // 检查灵石
            if (materials['灵石'] && gameState.spiritStones < materials['灵石']) {
                return false;
            }
            // 检查灵草类材料（通过探索获得）
            for (const [mat, qty] of Object.entries(materials)) {
                if (mat === '灵石') continue;
                const hasItem = gameState.inventory.some(item => 
                    item.name === mat && item.quantity >= qty
                );
                if (!hasItem) return false;
            }
            return true;
        }

        function consumeMaterials(materials) {
            // 消耗灵石
            if (materials['灵石']) {
                gameState.spiritStones -= materials['灵石'];
            }
            // 消耗其他材料
            for (const [mat, qty] of Object.entries(materials)) {
                if (mat === '灵石') continue;
                const item = gameState.inventory.find(i => i.name === mat);
                if (item) {
                    item.quantity -= qty;
                    if (item.quantity <= 0) {
                        gameState.inventory = gameState.inventory.filter(i => i !== item);
                    }
                }
            }
        }

        function returnMaterials(materials, rate) {
            // 返还30%材料
            for (const [mat, qty] of Object.entries(materials)) {
                if (mat === '灵石') {
                    gameState.spiritStones += Math.floor(qty * rate);
                } else {
                    const item = gameState.inventory.find(i => i.name === mat);
                    if (item) {
                        item.quantity += Math.floor(qty * rate);
                    } else if (Math.floor(qty * rate) > 0) {
                        gameState.inventory.push({
                            id: Date.now(),
                            type: 'material',
                            name: mat,
                            quantity: Math.floor(qty * rate),
                            quality: 'common',
                            effect: {},
                            desc: `回收的${mat}`,
                            icon: '🌿'
                        });
                    }
                }
            }
        }

        async function craftPill(name) {
            const recipe = ALCHEMY_RECIPES[name];
            const pill = PILLS[name];
            
            // 消耗材料
            consumeMaterials(recipe.materials);
            
            // 消耗1天
            gameState.days++;
            
            // 关闭详情，显示结果
            document.getElementById('alchemyDetail').style.display = 'none';
            const resultDiv = document.getElementById('alchemyResult');
            resultDiv.style.display = 'block';
            
            // 生成AI描述
            let craftDesc = '';
            if (apiConfig.apiKey && apiConfig.groupId) {
                try {
                    const prompt = `描述一次炼丹过程，丹药名称是${name}，用50-80字描述炼丹时的情景，包括火候、灵气变化等。`;
                    const response = await fetch(`${CONFIG.apiUrl}?GroupId=${apiConfig.groupId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiConfig.apiKey}`
                        },
                        body: JSON.stringify({
                            model: "MiniMax-Text-01",
                            tokens_to_generate: 150,
                            temperature: 0.8,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });
                    if (response.ok) {
                        const data = await response.json();
                        craftDesc = data.choices[0].text.trim();
                    }
                } catch (error) {
                    craftDesc = `丹炉中灵光闪烁，药香四溢...`;
                }
            } else {
                craftDesc = `丹炉中灵光闪烁，药香四溢...`;
            }
            
            // 判定成功
            const roll = Math.random();
            if (roll < recipe.successRate) {
                // 成功
                addToInventory('pill', name, 1, pill.quality, pill.effect, pill.desc, pill.icon);
                resultDiv.innerHTML = `
                    <div class="result-success">🎉 炼制成功！</div>
                    <p style="margin-top:10px;color:#aaa">${craftDesc}</p>
                    <p style="margin-top:10px;color:#ffd700">获得${name}×1，已放入背包</p>
                `;
                addLog('good', '炼丹成功', `成功炼制了${name}`);
            } else {
                // 失败，返还30%材料
                returnMaterials(recipe.materials, 0.3);
                resultDiv.innerHTML = `
                    <div class="result-fail">💔 炼制失败...</div>
                    <p style="margin-top:10px;color:#aaa">${craftDesc}</p>
                    <p style="margin-top:10px;color:#888">材料损毁严重，返还30%材料</p>
                `;
                addLog('bad', '炼丹失败', `炼制${name}失败`);
            }
            
            saveGame();
            updateDisplay();
            
            // 3秒后刷新炼丹界面
            setTimeout(() => {
                document.getElementById('alchemyResult').style.display = 'none';
                renderAlchemyRecipes();
            }, 3000);
        }

        // 更新准备加成列表显示
        function updatePrepList() {
            const prepList = document.getElementById('prepList');
            const preps = gameState.tribulation.preparations;
            if (preps.length === 0) {
                prepList.innerHTML = '';
                return;
            }
            prepList.innerHTML = '准备加成：' + preps.map(p => {
                let bonus = '';
                if (p === '阵法') bonus = '(伤害-30%)';
                if (p === '定神丹') bonus = '(心境消耗-50%)';
                if (p === '祈祷') bonus = '(成功率+10%)';
                return p + bonus;
            }).join('、');
        }

        // 添加准备选项
        function addPreparation(type) {
            if (gameState.tribulation.preparations.includes(type)) return;

            if (type === '阵法') {
                if (gameState.spiritStones < 2000) {
                    alert('灵石不足！布置阵法需要2000灵石');
                    return;
                }
                gameState.spiritStones -= 2000;
            } else if (type === '定神丹') {
                const idx = gameState.inventory.findIndex(item => item.name === '定神丹');
                if (idx === -1) {
                    alert('背包中没有定神丹！');
                    return;
                }
                gameState.inventory.splice(idx, 1);
            } else if (type === '祈祷') {
                if (gameState.spiritStones < 10000) {
                    alert('灵石不足！祈祷先祖需要10000灵石');
                    return;
                }
                gameState.spiritStones -= 10000;
            }

            gameState.tribulation.preparations.push(type);
            saveGame();
            showTribulationUI();
            updateDisplay();
        }

        // 计算渡劫成功率
        function calculateTribulationSuccess(tribKey) {
            const trib = TRIBULATIONS[tribKey];
            let rate = trib.baseRate;

            // 心境加成
            rate += (gameState.mindset / 100) * 0.2;

            // 转世重修buff
            if (gameState.hasTransmigrationBuff) {
                rate += 0.1;
            }

            // 装备加成
            const equipped = gameState.equippedTreasures.filter(t => t);
            equipped.forEach(t => {
                if (t.effects) {
                    t.effects.forEach(e => {
                        if (e.type === '渡劫_damage_reduce') rate += e.value * 0.1;
                        if (e.type === 'all_stats') rate += e.value * 0.5;
                    });
                }
            });

            // 准备加成
            if (gameState.tribulation.preparations.includes('阵法')) rate += 0.15;
            if (gameState.tribulation.preparations.includes('定神丹')) rate += 0.1;
            if (gameState.tribulation.preparations.includes('祈祷')) rate += 0.1;

            // 境界惩罚
            if (gameState.realm === 4) rate -= 0.1;
            if (gameState.realm === 5) rate -= 0.2;

            return Math.min(0.95, Math.max(0.05, rate));
        }

        // 开始渡劫
        async function startTribulation() {
            const tribKey = gameState.tribulation.tribKey;
            const trib = TRIBULATIONS[tribKey];

            // 心魔劫特殊处理
            if (trib.type === 'demon') {
                await handleDemonTribulation();
                return;
            }

            // 显示AI描述或本地处理
            if (!apiConfig.apiKey || !apiConfig.groupId) {
                executeTribulation();
                return;
            }

            // 显示天劫降临描述
            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `<div class="loading" style="color:#ffd700">天劫降临中...</div>`;

            try {
                const desc = await generateTribulationDesc(tribKey);
                scene.innerHTML = `<p style="color:#ffd700;font-size:1.2em">${desc}</p>`;
                setTimeout(() => executeTribulation(), 2000);
            } catch (error) {
                console.error('生成渡劫描述失败:', error);
                executeTribulation();
            }
        }

        // 生成渡劫描述
        async function generateTribulationDesc(tribKey) {
            const trib = TRIBULATIONS[tribKey];
            const prompts = {
                thunder: '描写一道金丹修士面对九天神雷降临时，雷云翻涌、电闪雷鸣的壮观场景',
                fire: '描写一位修士面对琉璃阴火时，周身火焰缭绕、焚心烧魄的险恶处境',
                wind: '描写修士经历九幽阴风时，狂风呼啸、刮骨伐髓的可怕体验',
                demon: '描写元婴修士面对心魔入侵时，心魔乱神、幻象丛生的诡异局面',
                all: '描写化神大能飞升之际，天劫齐至、毁天灭地的终极考验'
            };

            const prompt = prompts[trib.type] || '描写修仙渡劫场景';

            const response = await fetch(`${CONFIG.apiUrl}?GroupId=${apiConfig.groupId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiConfig.apiKey}`
                },
                body: JSON.stringify({
                    model: 'abab6.5s-chat',
                    tokens_to_generate: 200,
                    messages: [{
                        role: 'user',
                        content: `你是一个修仙游戏场景描述器。请生成一段50字左右的渡劫场景描述，描写${prompt}。只返回描述文字，不要其他内容。`
                    }],
                    temperature: 0.9
                })
            });

            const data = await response.json();
            return data.choices?.[0]?.messages?.[0]?.text || trib.desc;
        }

        // 执行渡劫判定
        function executeTribulation() {
            const rate = calculateTribulationSuccess(gameState.tribulation.tribKey);
            const roll = Math.random();

            if (roll < rate) {
                // 成功
                if (roll < rate * 0.5) {
                    // 大成功
                    handleGreatSuccess();
                } else {
                    // 普通成功
                    handleSuccess();
                }
            } else {
                // 失败
                if (roll < 0.3) {
                    // 陨落
                    handleDeath();
                } else {
                    // 重伤
                    handleInjury();
                }
            }
        }

        // 心魔劫特殊处理
        async function handleDemonTribulation() {
            const demonDamage = 20 * (gameState.tribulation.currentStage + 1);
            const preps = gameState.tribulation.preparations;

            // 定神丹效果减半
            if (preps.includes('定神丹')) {
                gameState.mindset = Math.max(0, gameState.mindset - Math.floor(demonDamage * 0.5));
            } else {
                gameState.mindset = Math.max(0, gameState.mindset - demonDamage);
            }

            gameState.tribulation.currentStage++;
            gameState.tribulation.damageTaken += demonDamage;

            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `
                <p style="color:#ff00ff;font-size:1.1em">心魔入侵！</p>
                <p style="color:#aaa;margin-top:10px">心境 -${demonDamage}${preps.includes('定神丹') ? '(定神丹减免)' : ''}</p>
                <p style="color:#ffd700;margin-top:10px">当前心境：${gameState.mindset}/100</p>
            `;

            saveGame();

            if (gameState.mindset <= 0) {
                // 心魔入侵失败
                gameState.mindset = 0;
                setTimeout(() => handleInjury(), 1500);
            } else if (gameState.tribulation.currentStage >= gameState.tribulation.totalStages) {
                // 心魔劫通过
                setTimeout(() => handleSuccess(), 1500);
            } else {
                // 继续心魔劫
                setTimeout(() => showTribulationUI(), 1500);
            }
        }

        // 大成功处理
        function handleGreatSuccess() {
            const trib = TRIBULATIONS[gameState.tribulation.tribKey];

            // 突破成功
            gameState.realm++;
            gameState.stage = 0;
            gameState.cultivationProgress = 0;
            gameState.maxQi = REALM_REQUIREMENTS[gameState.realm].maxQi;
            gameState.qi = Math.floor(gameState.qi * 0.5); // 大成功保留50%
            gameState.mindset = Math.min(100, gameState.mindset + 20); // 心境提升
            gameState.hasTransmigrationBuff = false; // 清除转世buff

            // 天劫洗礼加成
            gameState.activeEffects.attack += 0.1;
            gameState.activeEffects.defense += 0.1;

            // 记录
            gameState.tribulationRecord.push({
                type: gameState.tribulation.tribKey,
                result: '大成功',
                day: gameState.days
            });

            gameState.tribulation.inProgress = false;

            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `
                <div class="tribulation-result great-success">
                    <h3>✨ 大成功 ✨</h3>
                    <p style="color:#ffd700">天劫洗礼，你的修为突飞猛进！</p>
                    <p style="color:#aaa;margin-top:10px">突破到${CONFIG.realms[gameState.realm]}期！</p>
                    <p style="color:#4caf50;margin-top:5px">获得天劫洗礼加成：攻击+10%，防御+10%</p>
                    <p style="color:#ff69b4;margin-top:5px">心境+20</p>
                </div>
            `;

            addLog('good', '渡劫大成功', `历经天劫洗礼，突破到${CONFIG.realms[gameState.realm]}期！获得天劫洗礼加成！`);
            saveGame();
            updateDisplay();

            // 3秒后关闭
            setTimeout(() => {
                closeTribulationModal();
            }, 3000);
        }

        // 成功处理
        function handleSuccess() {
            const trib = TRIBULATIONS[gameState.tribulation.tribKey];

            // 突破成功
            gameState.realm++;
            gameState.stage = 0;
            gameState.cultivationProgress = 0;
            gameState.maxQi = REALM_REQUIREMENTS[gameState.realm].maxQi;
            gameState.qi = Math.floor(gameState.qi * 0.3);
            gameState.mindset = Math.max(0, gameState.mindset - 5);
            gameState.hasTransmigrationBuff = false;

            // 天劫洗礼加成（较小）
            gameState.activeEffects.attack += 0.05;
            gameState.activeEffects.defense += 0.05;

            // 记录
            gameState.tribulationRecord.push({
                type: gameState.tribulation.tribKey,
                result: '成功',
                day: gameState.days
            });

            gameState.tribulation.inProgress = false;

            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `
                <div class="tribulation-result success">
                    <h3>🎉 渡劫成功 🎉</h3>
                    <p style="color:#aaa">你历经重重磨难，终于渡过天劫！</p>
                    <p style="color:#ffd700;margin-top:10px">突破到${CONFIG.realms[gameState.realm]}期！</p>
                    <p style="color:#4caf50;margin-top:5px">获得天劫洗礼加成：攻击+5%，防御+5%</p>
                </div>
            `;

            addLog('good', '渡劫成功', `渡过${trib.desc}，突破到${CONFIG.realms[gameState.realm]}期！`);
            saveGame();
            updateDisplay();

            setTimeout(() => {
                closeTribulationModal();
            }, 3000);
        }

        // 重伤处理
        function handleInjury() {
            const trib = TRIBULATIONS[gameState.tribulation.tribKey];

            // 渡劫失败但保命
            gameState.qi = Math.floor(gameState.qi * 0.1);
            gameState.mindset = Math.max(0, gameState.mindset - 30);

            // 记录
            gameState.tribulationRecord.push({
                type: gameState.tribulation.tribKey,
                result: '重伤',
                day: gameState.days
            });

            gameState.tribulation.inProgress = false;

            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `
                <div class="tribulation-result injury">
                    <h3>💔 重伤💔</h3>
                    <p style="color:#aaa">天劫反噬，你身受重伤...</p>
                    <p style="color:#ff9800;margin-top:10px">灵气大幅减少，心境下降</p>
                    <p style="color:#aaa;margin-top:10px">突破失败，但保住了性命</p>
                </div>
            `;

            addLog('bad', '渡劫重伤', `渡过${trib.desc}失败，身受重伤...`);
            saveGame();
            updateDisplay();

            setTimeout(() => {
                closeTribulationModal();
            }, 3000);
        }

        // 陨落处理（转世重修）
        function handleDeath() {
            const trib = TRIBULATIONS[gameState.tribulation.tribKey];

            // 保留10%资源
            const keepStones = Math.floor(gameState.spiritStones * 0.1);
            const keepPills = gameState.inventory.filter(item =>
                item.name === '聚灵丹'
            ).slice(0, 2);

            // 重置状态
            gameState.realm = 1;
            gameState.stage = 0;
            gameState.qi = 50;
            gameState.maxQi = 100;
            gameState.spiritStones = keepStones;
            gameState.inventory = keepPills;
            gameState.mindset = 50;
            gameState.days = 1;
            gameState.cultivationProgress = 0;
            gameState.hasTransmigrationBuff = true; // 转世buff
            gameState.tribulation.inProgress = false;

            // 清空装备效果
            recalculateAllEffects();

            // 记录
            gameState.tribulationRecord.push({
                type: gameState.tribulation.tribKey,
                result: '陨落',
                day: gameState.days
            });

            const scene = document.getElementById('tribulationScene');
            scene.innerHTML = `
                <div class="tribulation-result death">
                    <h3>💀 陨落 💀</h3>
                    <p style="color:#f44336">天劫无情，你陨落了...</p>
                    <p style="color:#aaa;margin-top:10px">但天道循环，你得以转世重修</p>
                    <p style="color:#e1bee7;margin-top:10px">保留部分资源和记忆</p>
                    <p style="color:#ffd700;margin-top:10px">获得【转世重修】加成：成功率+10%</p>
                </div>
            `;

            addLog('bad', '渡劫陨落', `渡劫失败，陨落了...但转世重修，获得转世buff！`);

            setTimeout(() => {
                closeTribulationModal();
                saveGame();
                showGameUI();
                updateDisplay();
            }, 3000);
        }

        // 关闭渡劫模态框
        function closeTribulationModal() {
            document.getElementById('tribulationModal').classList.remove('active');
            gameState.tribulation.inProgress = false;
        }

        // 取消渡劫
        function cancelTribulation() {
            gameState.tribulation.inProgress = false;
            gameState.tribulation.preparations = [];
            closeTribulationModal();
            addLog('neutral', '暂缓突破', '你决定暂缓突破，继续积累实力...');
            saveGame();
        }
    </script>
</body>
</html>

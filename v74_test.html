<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>V74 MCP Tools Test</title>
<style>
body { font-family: monospace; background: #1a1a2e; color: #0ff; padding: 20px; }
.test { margin: 8px 0; padding: 6px 12px; border-radius: 4px; }
.pass { background: #0a3; color: #fff; }
.fail { background: #a00; color: #fff; }
#summary { margin-top: 20px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<h2>🌐 V74 MCP Agent Bridge Phase 2 — Tools Test</h2>
<div id="results"></div>
<div id="summary"></div>
<script src="game.js"></script>
<script>
// V74 Test Framework
const results = document.getElementById('results');
const summary = document.getElementById('summary');
let passed = 0, failed = 0;

function assert(condition, testName) {
  const div = document.createElement('div');
  div.className = 'test ' + (condition ? 'pass' : 'fail');
  div.textContent = (condition ? '✅ PASS' : '❌ FAIL') + ' — ' + testName;
  results.appendChild(div);
  if (condition) passed++; else failed++;
  return condition;
}

function assertEqual(actual, expected, name) {
  return assert(actual === expected, `${name}: expected ${expected}, got ${actual}`);
}

function assertContains(obj, field, name) {
  return assert(obj && field in obj, `${name}: object ${JSON.stringify(obj).slice(0,50)} has field '${field}'`);
}

function assertNotError(result, name) {
  return assert(!result.error, `${name}: result has no error — ${JSON.stringify(result).slice(0,80)}`);
}

// Mock window.gameState for testing
window.gameState = {
  realm: 2, stage: 1, level: 5,
  spiritEnergy: 500, maxSpiritEnergy: 1000,
  cultivationProgress: 45, maxCultivationProgress: 100,
  tribulationCount: 3, flawlessTribulations: 1,
  spiritStones: 1234,
  items: [
    { id: 'item_001', name: '筑基丹', type: 'pill', quality: 'SR', count: 3 },
    { id: 'item_002', name: '灵剑', type: 'equipment', quality: 'R', count: 1 },
    { id: 'item_003', name: '灵草', type: 'material', quality: 'N', count: 10 }
  ],
  skills: [
    { id: 'skill_001', name: '烈火诀', realmRequired: 1, level: 3 },
    { id: 'skill_002', name: '寒冰术', realmRequired: 2, level: 1 }
  ],
  achievements: [
    { id: 'ach_001', name: '初入仙途', completed: true, progress: 100 },
    { id: 'ach_002', name: '渡劫成功', completed: false, progress: 30 }
  ],
  combatState: {
    playerHp: 80, playerMaxHp: 100,
    opponentHp: 60, opponentMaxHp: 100,
    turn: 3, combatEnergy: 50
  },
  npcCollab: { npcs: [{ id: 'npc_001', name: '师尊', role: 'master' }], activeTasks: 2 },
  serendipityDAG: {
    nodes: new Map([
      ['ser_treasure_discover', { id: 'ser_treasure_discover', name: '奇遇-宝藏发现', type: 'treasure', status: 'completed', triggerCount: 1 }],
      ['ser_treasure_excavate', { id: 'ser_treasure_excavate', name: '奇遇-挖掘宝藏', type: 'treasure', status: 'idle', triggerCount: 0 }]
    ])
  }
};

// Mock llmRegistry
window.llmRegistry = {
  getAllProviders() {
    return [
      { id: 'minimax', name: 'MiniMax' },
      { id: 'openai', name: 'OpenAI' }
    ];
  },
  isConfigured(id) { return id === 'minimax'; },
  activeProviderId: 'minimax',
  setActive(id) { return id === 'minimax' || id === 'openai'; }
};

const server = cultivationMCPServer;

// T1: toolRegistry now has 14 tools (8 original + 6 new)
assertEqual(server.toolRegistry.size, 14, 'T1: toolRegistry has 14 tools');

// T2: listTools returns all 14 tool names
const toolsResult = server.listTools();
const toolsData = JSON.parse(toolsResult.content[0].text);
const toolNames = toolsData.tools.map(t => t.name).sort();
const expected = ['achievement.query','battle.status','battle.start','cultivation.advance','gameState.query','inventory.query','item.exchange','mcp.providers','mcp.switch_provider','npc.query','realm.query','serendipity.list','serendipity.trigger','skill.list'].sort();
assert(toolNames.join(',') === expected.join(','), `T2: all 14 tools listed, got: ${toolNames.join(',')}`);

// T3: realm.query basic
const realmBasic = server.mcpRealmQuery('basic');
assertNotError(realmBasic, 'T3: realm.query basic no error');
assertEqual(realmBasic.realm, 2, 'T3: realm value');
assertEqual(realmBasic.realmName, '金丹', 'T3: realm name');

// T4: realm.query full
const realmFull = server.mcpRealmQuery('full');
assertNotError(realmFull, 'T4: realm.query full no error');
assertEqual(realmFull.maxCultivationProgress, 100, 'T4: full has maxCultivationProgress');

// T5: inventory.query all
const invAll = server.mcpInventoryQuery('all');
assertNotError(invAll, 'T5: inventory.query all no error');
assertEqual(invAll.count, 3, 'T5: inventory count 3');
assertEqual(invAll.filter, 'all', 'T5: filter is all');

// T6: inventory.query pills
const invPills = server.mcpInventoryQuery('pills');
assertNotError(invPills, 'T6: inventory.query pills no error');
assertEqual(invPills.count, 1, 'T6: pills count 1');

// T7: skill.list all
const skillsAll = server.mcpSkillList();
assertNotError(skillsAll, 'T7: skill.list no error');
assertEqual(skillsAll.count, 2, 'T7: skill count 2');

// T8: skill.list realm filter
const skillsRealm1 = server.mcpSkillList(1);
assertNotError(skillsRealm1, 'T8: skill.list realm=1 no error');
assertEqual(skillsRealm1.count, 1, 'T8: skills realm<=1 count 1');

// T9: achievement.query all
const achAll = server.mcpAchievementQuery('all');
assertNotError(achAll, 'T9: achievement.query all no error');
assertEqual(achAll.count, 2, 'T9: achievement count 2');

// T10: achievement.query completed
const achCompleted = server.mcpAchievementQuery('completed');
assertNotError(achCompleted, 'T10: achievement.query completed no error');
assertEqual(achCompleted.count, 1, 'T10: completed count 1');

// T11: serendipity.list all
const serAll = server.mcpSerendipityList('all');
assertNotError(serAll, 'T11: serendipity.list all no error');
assertEqual(serAll.total, 2, 'T11: total nodes 2');
assertEqual(serAll.count, 2, 'T11: count all 2');

// T12: serendipity.list completed
const serCompleted = server.mcpSerendipityList('completed');
assertNotError(serCompleted, 'T12: serendipity.list completed no error');
assertEqual(serCompleted.count, 1, 'T12: completed count 1');

// T13: battle.status active
const battleActive = server.mcpBattleStatus();
assertNotError(battleActive, 'T13: battle.status no error');
assertEqual(battleActive.inBattle, true, 'T13: inBattle true');
assertEqual(battleActive.playerHp, 80, 'T13: playerHp 80');

// T14: callTool realm.query via switch
const callRealm = server.callTool('realm.query', { detail: 'basic' });
assertNotError(JSON.parse(callRealm.content[0].text), 'T14: callTool realm.query works');

// T15: callTool inventory.query
const callInv = server.callTool('inventory.query', { filter: 'all' });
assertNotError(JSON.parse(callInv.content[0].text), 'T15: callTool inventory.query works');

// T16: callTool skill.list
const callSkill = server.callTool('skill.list', { realm: 1 });
assertNotError(JSON.parse(callSkill.content[0].text), 'T16: callTool skill.list works');

// T17: callTool achievement.query
const callAch = server.callTool('achievement.query', { filter: 'all' });
assertNotError(JSON.parse(callAch.content[0].text), 'T17: callTool achievement.query works');

// T18: callTool serendipity.list
const callSer = server.callTool('serendipity.list', { filter: 'all' });
assertNotError(JSON.parse(callSer.content[0].text), 'T18: callTool serendipity.list works');

// T19: callTool battle.status
const callBattle = server.callTool('battle.status', {});
assertNotError(JSON.parse(callBattle.content[0].text), 'T19: callTool battle.status works');

// T20: callTool unknown returns error
const callUnknown = server.callTool('nonexistent.tool', {});
assert(callUnknown.isError, 'T20: unknown tool returns isError=true');

// T21: tools.list includes all new tools
const allTools = JSON.parse(server.listTools().content[0].text).tools.map(t => t.name);
assert(allTools.includes('realm.query'), 'T21: realm.query in list');
assert(allTools.includes('inventory.query'), 'T21: inventory.query in list');
assert(allTools.includes('skill.list'), 'T21: skill.list in list');
assert(allTools.includes('achievement.query'), 'T21: achievement.query in list');
assert(allTools.includes('serendipity.list'), 'T21: serendipity.list in list');
assert(allTools.includes('battle.status'), 'T21: battle.status in list');

// Summary
summary.textContent = `V74 Test Results: ${passed}/${passed+failed} passed (${((passed/(passed+failed))*100).toFixed(1)}%)`;
summary.style.color = failed > 0 ? '#f00' : '#0f0';
if (failed === 0) {
  summary.textContent += ' — ALL TESTS PASSED ✅';
}
</script>
</body>
</html>

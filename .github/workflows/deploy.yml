name: Deploy to GitHub Pages

on:
  push:
    branches: [gp-pages]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== Build verification ==="
          echo "dist/game.js size: $(wc -c < dist/game.js) bytes"
          echo "dist/index.html size: $(wc -c < dist/index.html) bytes"
          echo "CONFIG found: $(grep -c 'const CONFIG = {' dist/game.js)"
          echo "init() found: $(grep -c 'function init(' dist/game.js)"
          echo "Syntax OK: $(node --check dist/game.js && echo YES || echo NO)"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

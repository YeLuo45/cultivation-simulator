<!DOCTYPE html>
<html>
<head><title>V98 TDD Tests</title></head>
<body>
<pre id="output"></pre>
<script src="game.js"></script>
<script>
const output = document.getElementById('output');
const log = (msg) => { output.textContent += msg + '\n'; };

async function runV98Tests() {
    const server = window.__mcpServer || new CultivationMCPServer();
    let passed = 0, failed = 0;

    function test(name, fn) {
        try {
            const result = fn();
            const ok = !!result;
            log((ok ? '✓' : '✗') + ' ' + name);
            if (ok) passed++; else failed++;
        } catch (e) {
            log('✗ ' + name + ' - Error: ' + e.message);
            failed++;
        }
    }

    log('=== V98 Cross-Server Sect War TDD Tests ===\n');

    // Tool Registry Tests
    log('--- Tool Registry Tests ---');
    test('MCP_TOOLS_V98 defined with 6 tools', () => typeof MCP_TOOLS_V98 === 'object' && Object.keys(MCP_TOOLS_V98).length === 6);
    test('All 6 tools registered in toolRegistry', () => {
        return ['sect.war.register', 'sect.war.start', 'sect.war.skill.combo', 'sect.war.status', 'sect.war.result', 'sect.war.reward'].every(t => server.toolRegistry.has(t));
    });

    // sect.war.register Tests
    log('\n--- sect.war.register Tests ---');
    test('Requires teamName, playerIds, sectId', () => server.mcpSectWarRegister({}).error.includes('required'));
    test('Requires 3-5 players', () => server.mcpSectWarRegister({ teamName: 'T', playerIds: ['p1', 'p2'], sectId: 's1' }).error.includes('3-5'));
    test('Creates match with valid ID', () => {
        const r = server.mcpSectWarRegister({ teamName: 'Thunder Sect', playerIds: ['p1', 'p2', 'p3'], sectId: 's1', warType: 'skirmish' });
        return r.success && r.matchId.startsWith('war_');
    });
    test('Returns enemy team info', () => {
        const r = server.mcpSectWarRegister({ teamName: 'T', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        return r.enemyTeamName && r.enemySize === 3;
    });
    test('Sets correct war type duration', () => {
        const r1 = server.mcpSectWarRegister({ teamName: 'T', playerIds: ['p1', 'p2', 'p3'], sectId: 's1', warType: 'skirmish' });
        const r2 = server.mcpSectWarRegister({ teamName: 'T', playerIds: ['p1', 'p2', 'p3'], sectId: 's1', warType: 'territory' });
        return r1.estimatedDuration === '5 min' && r2.estimatedDuration === '10 min';
    });

    // sect.war.start Tests
    log('\n--- sect.war.start Tests ---');
    test('Requires matchId', () => server.mcpSectWarStart({}).error.includes('matchId required'));
    test('Fails for non-existent match', () => server.mcpSectWarStart({ matchId: 'nonexistent' }).error.includes('not found'));
    test('Activates registered match', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        const start = server.mcpSectWarStart({ matchId: reg.matchId });
        return start.success && start.status === 'active';
    });
    test('Executes DAG actions', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        const start = server.mcpSectWarStart({ matchId: reg.matchId, actions: [{ playerId: 'p1', skillId: 'f' }, { playerId: 'p2', skillId: 's' }] });
        return start.dagExecuted === 2;
    });

    // sect.war.skill.combo Tests
    log('\n--- sect.war.skill.combo Tests ---');
    test('Requires playerId and skillId', () => server.mcpSectWarSkillCombo({}).error.includes('required'));
    test('Returns no combo when no adjacent', () => {
        const r = server.mcpSectWarSkillCombo({ playerId: 'p1', skillId: 'fire_skill', adjacentPlayerIds: [] });
        return r.comboTriggered === false;
    });
    test('Calculates position bonus', () => {
        const r = server.mcpSectWarSkillCombo({ playerId: 'p1', skillId: 's', adjacentPlayerIds: ['p2', 'p3'] });
        return r.adjacentCount === 2;
    });

    // sect.war.status Tests
    log('\n--- sect.war.status Tests ---');
    test('Requires matchId', () => server.mcpSectWarStatus({}).error.includes('matchId required'));
    test('Returns active match info', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const s = server.mcpSectWarStatus({ matchId: reg.matchId });
        return s.matchId === reg.matchId && s.status === 'active';
    });
    test('Shows energy levels', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const s = server.mcpSectWarStatus({ matchId: reg.matchId });
        return s.energyLeft && typeof s.energyLeft.teamA === 'number';
    });

    // sect.war.result Tests
    log('\n--- sect.war.result Tests ---');
    test('Requires matchId', () => server.mcpSectWarResult({}).error.includes('matchId required'));
    test('Fails for incomplete match', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        return server.mcpSectWarResult({ matchId: reg.matchId }).error.includes('not yet completed');
    });
    test('Returns winner after match', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const r = server.mcpSectWarResult({ matchId: reg.matchId });
        return r.winner && (r.winner === 'Test' || r.winner.startsWith('Enemy_'));
    });
    test('Includes player stats', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const r = server.mcpSectWarResult({ matchId: reg.matchId });
        return r.playerStats && r.playerStats.length === 3;
    });

    // sect.war.reward Tests
    log('\n--- sect.war.reward Tests ---');
    test('Requires matchId', () => server.mcpSectWarReward({}).error.includes('matchId required'));
    test('Fails for incomplete match', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        return server.mcpSectWarReward({ matchId: reg.matchId }).error.includes('not yet completed');
    });
    test('Distributes rewards after match', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const r = server.mcpSectWarReward({ matchId: reg.matchId });
        return r.result && (r.result === 'victory' || r.result === 'defeat');
    });
    test('Supports contribution mode', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const r = server.mcpSectWarReward({ matchId: reg.matchId, contributionMode: 'contribution' });
        return r.rewards.every(x => x.mode === 'contribution');
    });
    test('Includes spirit stones', () => {
        const reg = server.mcpSectWarRegister({ teamName: 'Test', playerIds: ['p1', 'p2', 'p3'], sectId: 's1' });
        server.mcpSectWarStart({ matchId: reg.matchId });
        const r = server.mcpSectWarReward({ matchId: reg.matchId });
        return r.rewards.every(x => typeof x.spiritStones === 'number');
    });

    // Summary
    const total = passed + failed;
    const passRate = Math.round((passed / total) * 100);
    log('\n=== Results: ' + passed + '/' + total + ' passed (' + passRate + '%)');
    log('Status: ' + (passRate >= 80 ? 'PASS ✓' : 'FAIL ✗') + ' (required ≥80%)');
}
runV98Tests();
</script>
</body>
</html>
